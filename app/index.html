<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <p class="eyebrow">GTA VI COVER MAKER</p>
    <h1>Make your cover art</h1>
    <p class="lede">Drop in a photo, add a caption, and export a multi-panel Vice City style cover. Everything stays on your machine.</p>
    <label class="field">Photo
      <input id="photo" type="file" accept="image/*">
    </label>
    <label class="field">Caption
      <input id="caption" type="text" maxlength="48" value="SUNSET HEIST">
    </label>
    <label class="field">Post size
      <select id="size">
        <option value="1080x1080">Square · 1080×1080</option>
        <option value="1080x1350">Portrait · 1080×1350</option>
        <option value="1920x1080">Landscape · 1920×1080</option>
      </select>
    </label>
    <div class="actions">
      <button id="export" type="button">Export PNG</button>
    </div>
    <p id="status" role="status" class="status">Load a photo or use the sample scene.</p>
  </section>
  <div class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
