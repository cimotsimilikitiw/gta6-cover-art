<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vice Cover Studio</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="panel" id="controls">
        <header class="brand">
          <p class="kicker">Vice Cover Studio</p>
          <h1>Build a cover that hits like sunset on neon.</h1>
          <p class="intro">Load a photo, write a line, pick a format. The composition is rendered locally on canvas.</p>
        </header>

        <label class="control" for="photoInput">
          <span>Photo</span>
          <input id="photoInput" type="file" accept="image/*">
        </label>

        <label class="control" for="captionInput">
          <span>Caption</span>
          <input id="captionInput" type="text" maxlength="42" value="NEON SUNSET" spellcheck="false">
        </label>

        <label class="control" for="formatInput">
          <span>Format</span>
          <select id="formatInput">
            <option value="square">Square 1080 × 1080</option>
            <option value="portrait">Portrait 1080 × 1350</option>
            <option value="landscape">Landscape 1920 × 1080</option>
          </select>
        </label>

        <div class="control">
          <span>Sample scene</span>
          <div class="sample-row" role="group" aria-label="Sample scenes">
            <button type="button" class="sample" data-sample="pier">Pier</button>
            <button type="button" class="sample" data-sample="boulevard">Boulevard</button>
          </div>
        </div>

        <div class="actions">
          <button id="downloadBtn" type="button" class="primary">Export PNG</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">Ready.</p>
      </aside>

      <main class="stage" aria-label="Cover preview">
        <div class="canvas-frame">
          <canvas id="cover" width="1080" height="1080"></canvas>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
